<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Room {{ room_code }} - Watch Party</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="room-page" data-room-code="{{ room_code }}"
    data-drift-threshold-seconds="{{ drift_threshold_seconds }}"
    data-drift-check-interval-ms="{{ drift_check_interval_ms }}"
    data-drift-correction-cooldown-ms="{{ drift_correction_cooldown_ms }}">
    <main class="room-shell">
      <nav>
        <a class="brand" href="/">watch<span>party</span></a
        ><span id="connection-status" class="status">Connecting...</span>
      </nav>
      <section class="room-header">
        <div>
          <p class="eyebrow">YOUR WATCH ROOM</p>
          <h1>Room <span>{{ room_code }}</span></h1>
        </div>
        <button id="copy-link" class="secondary">Copy invite link</button>
      </section>
      <section class="watch-layout">
        <div class="player-card">
          <video id="shared-video" controls preload="metadata" playsinline>
            <source src="https://media.w3.org/2010/05/sintel/trailer.mp4" type="video/mp4" />
            Your browser does not support HTML5 video.
          </video>
          <p id="playback-notice" class="playback-notice" role="status" aria-live="polite"></p>
          <small class="video-credit">Sample: <a href="https://www.sintel.org/" target="_blank" rel="noreferrer">Sintel trailer</a>, Blender Foundation, <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noreferrer">CC BY 3.0</a>.</small>
        </div>
        <aside class="participants-panel">
          <div class="panel-heading">
            <h2>In the room</h2>
            <span id="participant-count">0</span>
          </div>
          <ul id="participant-list" aria-live="polite"></ul>
          <p id="room-message" class="room-message" aria-live="polite"></p>
        </aside>
      </section>
      <section class="share-code">
        <p>Share this code</p>
        <strong>{{ room_code }}</strong
        ><span>Anyone with this code can join from the home page.</span>
      </section>
    </main>
    <script src="/static/room.js"></script>
  </body>
</html>
