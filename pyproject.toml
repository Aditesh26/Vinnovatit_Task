[project]
name = "vinnovatit-task"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aditesh Patro", email = "aditeshpatro@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.1",
    "jinja2>=3.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
vinnovatit-task = "vinnovatit_task:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
